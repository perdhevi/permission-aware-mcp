# Preserve the existing development database across directory moves.
name: permission-aware-mcp

services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: permission_mcp
      POSTGRES_USER: permission_mcp
      POSTGRES_PASSWORD: permission_mcp
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U permission_mcp -d permission_mcp"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  postgres_data:
