# Preserve the existing development database across directory moves.
name: permission-aware-mcp

services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1
    profiles: [oidc]
    command: [start-dev, --import-realm]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: local-admin-only
      KC_HOSTNAME: http://127.0.0.1:8081
    ports:
      - "127.0.0.1:8081:8080"
    volumes:
      - keycloak_data:/opt/keycloak/data
      - ./seed/keycloak-realm.json:/opt/keycloak/data/import/permission-mcp.json:ro
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: permission_mcp
      POSTGRES_USER: permission_mcp
      POSTGRES_PASSWORD: permission_mcp
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U permission_mcp -d permission_mcp"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  keycloak_data:
  postgres_data:
